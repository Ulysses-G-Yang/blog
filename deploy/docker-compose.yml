# 家庭服务器博客镜像:nginx 托管静态文件 + umami 访问统计
# 用法:docker compose up -d
name: blog

services:
  # 博客静态站点(默认端口 8088)
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '8088:80'
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # 定时从 GitHub 拉取最新代码并构建,产物输出到 ./site
  builder:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /repo
    environment:
      REPO_URL: https://github.com/3023345758/blog.git
      BRANCH: main
      INTERVAL: '300' # 同步间隔(秒)
    volumes:
      - ./sync.sh:/sync.sh:ro
      - ./site:/out
      - repo-data:/repo
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          sh /sync.sh || echo "[$$(date '+%F %T')] sync failed, retry later";
          sleep "$$INTERVAL";
        done

  # umami 访问统计(端口 3001,默认账号 admin / umami)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami_pass_change_me@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: change-me-to-a-random-string
    depends_on:
      - umami-db

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_pass_change_me
    volumes:
      - umami-db-data:/var/lib/postgresql/data

volumes:
  repo-data:
  umami-db-data:

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml application/json;

    # 静态资源带哈希,长缓存
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 目录形式路由(/blog/xxx/ → /blog/xxx/index.html)
    # 注意用 $uri/ 而不是 $uri/index.html,后者在带尾斜杠时会拼出双斜杠
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
